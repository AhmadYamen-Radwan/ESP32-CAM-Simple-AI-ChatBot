[env:esp32cam]
platform = espressif32 @ 6.12.0
board = esp32cam
framework = arduino
board_build.flash_mode = dout
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

lib_deps = 
    nocturnailed-community/NocLLM@^1.0.0
    felipedadison/WireGuard-ESP32@^0.2.0
    witnessmenow/UniversalTelegramBot@^1.3.0
    bblanchon/ArduinoJson@^6.19.4
